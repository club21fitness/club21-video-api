<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic - Segments Club21</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { font-size: 24px; margin-bottom: 10px; color: #333; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 20px;
    }
    .button:hover { transform: translateY(-2px); }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .status.loading { display: block; background: #e3f2fd; border-left: 4px solid #2196f3; color: #1565c0; }
    .status.success { display: block; background: #e8f5e9; border-left: 4px solid #4caf50; color: #2e7d32; }
    .status.error { display: block; background: #ffebee; border-left: 4px solid #f44336; color: #c62828; }
    .response-box { background: #f5f5f5; padding: 12px; border-radius: 4px; margin-top: 10px; font-family: monospace; font-size: 12px; word-break: break-all; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Diagnostic Segments</h1>
    <p class="subtitle">Affiche les chemins exacts cherchés pour chaque réponse</p>
    
    <button class="button" onclick="testDiagnostic()">🚀 Lancer le diagnostic (avec données de test)</button>
    
    <div id="status" class="status">
      <div id="statusText"></div>
      <div id="responseBox" class="response-box"></div>
    </div>
  </div>

  <script>
    async function testDiagnostic() {
      const statusDiv = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const responseBox = document.getElementById('responseBox');

      statusDiv.className = 'status loading';
      statusText.textContent = '⏳ Appel au diagnostic...';
      responseBox.textContent = '';

      const payload = {
        prenom: 'Camron',
        answers: {
          age: '25_34',
          taille: '180',
          poids: '85',
          niveau: 'avance',
          sexe: 'homme',
          objectif: 'muscle_h',
          physique: 'composition_h',
          location: 'salle',
          sessions: '4',
          blessure: 'aucune',
          nourriture: 'equilibre',
          sommeil: 'tres_bien',
          contact: 'whatsapp'
        }
      };

      try {
        const response = await fetch('/.netlify/functions/diagnostic-segments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          statusDiv.className = 'status success';
          statusText.textContent = '✅ Diagnostic terminé';
          responseBox.textContent = JSON.stringify(data, null, 2);
        } else {
          statusDiv.className = 'status error';
          statusText.textContent = '❌ Erreur API';
          responseBox.textContent = JSON.stringify(data, null, 2);
        }
      } catch (error) {
        statusDiv.className = 'status error';
        statusText.textContent = '❌ Erreur de connexion';
        responseBox.textContent = error.message;
      }
    }
  </script>
</body>
</html>
