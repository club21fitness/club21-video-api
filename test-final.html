<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Club21 - Créateur de Vidéo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { font-size: 24px; margin-bottom: 10px; color: #333; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
    .button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 20px;
    }
    .button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
    .button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .status.loading { display: block; background: #e3f2fd; border-left: 4px solid #2196f3; color: #1565c0; }
    .status.success { display: block; background: #e8f5e9; border-left: 4px solid #4caf50; color: #2e7d32; }
    .status.error { display: block; background: #ffebee; border-left: 4px solid #f44336; color: #c62828; }
    .response-box { background: #f5f5f5; padding: 12px; border-radius: 4px; margin-top: 10px; font-family: monospace; font-size: 12px; word-break: break-all; max-height: 300px; overflow-y: auto; }
    .demo-btn { background: none; border: 1px solid #ddd; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 10px; width: 100%; }
    .demo-btn:hover { background: #667eea; color: white; border-color: #667eea; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Test Créateur de Vidéo Club21</h1>
    <p class="subtitle">Teste tous les 14 champs du quiz</p>
    
    <button class="demo-btn" onclick="fillDemo()">📋 Charger données de test</button>
    
    <form id="testForm" style="margin-top: 20px;">
      <!-- 1. Prénom -->
      <div class="form-group">
        <label for="prenom">1️⃣ Prénom</label>
        <input type="text" id="prenom" required placeholder="Ex: Marie">
      </div>
      
      <!-- 2. Âge -->
      <div class="form-group">
        <label for="age">2️⃣ Âge</label>
        <select id="age" required>
          <option value="">-- Sélectionne --</option>
          <option value="18_24">18-24 ans</option>
          <option value="25_34">25-34 ans</option>
          <option value="35_44">35-44 ans</option>
          <option value="45_plus">45+ ans</option>
        </select>
      </div>
      
      <!-- 3. Taille (pas de segment vidéo) -->
      <div class="form-group">
        <label for="taille">3️⃣ Taille (cm)</label>
        <input type="number" id="taille" placeholder="Ex: 170">
      </div>
      
      <!-- 4. Poids (pas de segment vidéo) -->
      <div class="form-group">
        <label for="poids">4️⃣ Poids (kg)</label>
        <input type="number" id="poids" placeholder="Ex: 70">
      </div>
      
      <!-- 5. Niveau -->
      <div class="form-group">
        <label for="niveau">5️⃣ Niveau</label>
        <select id="niveau" required>
          <option value="">-- Sélectionne --</option>
          <option value="debutant">Débutant</option>
          <option value="intermediaire">Intermédiaire</option>
          <option value="avance">Avancé</option>
        </select>
      </div>
      
      <!-- 6. Sexe -->
      <div class="form-group">
        <label for="sexe">6️⃣ Sexe</label>
        <select id="sexe" required>
          <option value="">-- Sélectionne --</option>
          <option value="homme">Homme</option>
          <option value="femme">Femme</option>
        </select>
      </div>
      
      <!-- 7. Objectif -->
      <div class="form-group">
        <label for="objectif">7️⃣ Objectif</label>
        <select id="objectif" required>
          <option value="">-- Sélectionne --</option>
          <option value="perdre_poids_h">Perdre du poids (H)</option>
          <option value="mincir_f">Mincir (F)</option>
          <option value="galber_f">Galber (F)</option>
          <option value="muscle_h">Prendre du muscle (H)</option>
          <option value="recomposition_h">Recomposition (H)</option>
          <option value="tonifier_f">Tonifier (F)</option>
        </select>
      </div>
      
      <!-- 8. Physique -->
      <div class="form-group">
        <label for="physique">8️⃣ Physique actuel</label>
        <select id="physique" required>
          <option value="">-- Sélectionne --</option>
          <option value="composition_h">Composition (H)</option>
          <option value="composition_f">Composition (F)</option>
          <option value="mince_h">Mince (H)</option>
          <option value="mince_f">Mince (F)</option>
          <option value="equilibre">Équilibré</option>
        </select>
      </div>
      
      <!-- 9. Lieu d'entraînement -->
      <div class="form-group">
        <label for="location">9️⃣ Où t'entraînes-tu ?</label>
        <select id="location" required>
          <option value="">-- Sélectionne --</option>
          <option value="maison">À la maison</option>
          <option value="salle">En salle de sport</option>
        </select>
      </div>
      
      <!-- 10. Séances par semaine -->
      <div class="form-group">
        <label for="sessions">🔟 Séances par semaine</label>
        <select id="sessions" required>
          <option value="">-- Sélectionne --</option>
          <option value="3">3 séances</option>
          <option value="4">4 séances</option>
          <option value="5">5 séances</option>
          <option value="6">6 séances</option>
        </select>
      </div>
      
      <!-- 11. Blessures -->
      <div class="form-group">
        <label for="blessure">1️⃣1️⃣ Blessures</label>
        <select id="blessure" required>
          <option value="">-- Sélectionne --</option>
          <option value="aucune">Aucune</option>
          <option value="generique">Générique</option>
        </select>
      </div>
      
      <!-- 12. Alimentation -->
      <div class="form-group">
        <label for="nourriture">1️⃣2️⃣ Relation avec la nourriture</label>
        <select id="nourriture" required>
          <option value="">-- Sélectionne --</option>
          <option value="equilibre">Équilibrée</option>
          <option value="stress">Mangeur de stress</option>
          <option value="fringales_soir">Fringales le soir</option>
          <option value="emotions">Mangeur d'émotions</option>
          <option value="complique">C'est compliqué</option>
        </select>
      </div>
      
      <!-- 13. Sommeil -->
      <div class="form-group">
        <label for="sommeil">1️⃣3️⃣ Qualité du sommeil</label>
        <select id="sommeil" required>
          <option value="">-- Sélectionne --</option>
          <option value="tres_mal">Très mauvais</option>
          <option value="moyen">Moyen</option>
          <option value="tres_bien">Très bon</option>
        </select>
      </div>
      
      <!-- 14. Contact (pas de segment vidéo) -->
      <div class="form-group">
        <label for="contact">1️⃣4️⃣ Comment tu veux être contactée?</label>
        <select id="contact">
          <option value="whatsapp">WhatsApp</option>
          <option value="email">Email</option>
          <option value="instagram">Instagram DM</option>
        </select>
      </div>
      
      <button type="submit" class="button">🚀 Créer la vidéo personnalisée</button>
    </form>
    
    <div id="status" class="status">
      <div id="statusText"></div>
      <div id="responseBox" class="response-box"></div>
    </div>
  </div>

  <script>
    function fillDemo() {
      document.getElementById('prenom').value = 'Camron';
      document.getElementById('age').value = '25_34';
      document.getElementById('taille').value = '180';
      document.getElementById('poids').value = '85';
      document.getElementById('niveau').value = 'avance';
      document.getElementById('sexe').value = 'homme';
      document.getElementById('objectif').value = 'muscle_h';
      document.getElementById('physique').value = 'composition_h';
      document.getElementById('location').value = 'salle';
      document.getElementById('sessions').value = '4';
      document.getElementById('blessure').value = 'aucune';
      document.getElementById('nourriture').value = 'equilibre';
      document.getElementById('sommeil').value = 'tres_bien';
      document.getElementById('contact').value = 'whatsapp';
    }

    document.getElementById('testForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const statusDiv = document.getElementById('status');
      const statusText = document.getElementById('statusText');
      const responseBox = document.getElementById('responseBox');

      statusDiv.className = 'status loading';
      statusText.textContent = '⏳ Création de la vidéo en cours...';
      responseBox.textContent = '';

      const payload = {
        prenom: document.getElementById('prenom').value,
        answers: {
          age: document.getElementById('age').value,
          taille: document.getElementById('taille').value,
          poids: document.getElementById('poids').value,
          niveau: document.getElementById('niveau').value,
          sexe: document.getElementById('sexe').value,
          objectif: document.getElementById('objectif').value,
          physique: document.getElementById('physique').value,
          location: document.getElementById('location').value,
          sessions: document.getElementById('sessions').value,
          blessure: document.getElementById('blessure').value,
          nourriture: document.getElementById('nourriture').value,
          sommeil: document.getElementById('sommeil').value,
          contact: document.getElementById('contact').value
        }
      };

      try {
        const response = await fetch('/.netlify/functions/create-video-ffmpeg', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (response.ok) {
          statusDiv.className = 'status success';
          statusText.textContent = '✅ Vidéo créée avec succès !';
          responseBox.textContent = JSON.stringify(data, null, 2);
        } else {
          statusDiv.className = 'status error';
          statusText.textContent = '❌ Erreur lors de la création';
          responseBox.textContent = JSON.stringify(data, null, 2);
        }
      } catch (error) {
        statusDiv.className = 'status error';
        statusText.textContent = '❌ Erreur de connexion';
        responseBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>
